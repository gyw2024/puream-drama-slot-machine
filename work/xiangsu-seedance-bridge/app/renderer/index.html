<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>纯梦短剧老虎机</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><img src="../assets/icons/slot.png" alt=""></span>
        <div>
          <h1>纯梦短剧老虎机</h1>
          <p id="providerSubtitle">正在读取视频上游…</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="openWorkbench" class="ghost-button"><img src="../assets/icons/drag.png" alt="">漫剧工作台</button>
        <div id="bridgeBadge" class="bridge-badge offline"><i></i><b>视频上游检测中</b></div>
        <button id="startBridge" class="ghost-button"><img src="../assets/icons/lock.png" alt="">启动后台桥</button>
        <div class="account-chip"><span>纯梦创作台</span><em>本机</em></div>
      </div>
    </header>

    <div class="workspace">
      <nav class="side-rail" aria-label="主导航">
        <button class="rail-item active"><img src="../assets/icons/slot.png" alt=""><span>创作</span></button>
        <button class="rail-item"><img src="../assets/icons/history.png" alt=""><span>历史</span></button>
        <button id="diagnostics" class="rail-item"><img src="../assets/icons/settings.png" alt=""><span>检测</span></button>
        <div class="rail-spacer"></div>
        <div class="rail-rules">
          <strong>素材规则</strong>
          <span><img src="../assets/icons/image.png" alt=""><b id="railImageCount">0/9</b></span>
          <span><img src="../assets/icons/video.png" alt=""><b id="railVideoCount">0/3</b></span>
          <span><img src="../assets/icons/audio.png" alt=""><b id="railAudioCount">0/3</b></span>
        </div>
      </nav>

      <section class="creator-column">
        <section class="panel materials-panel">
          <div class="panel-heading">
            <div>
              <span class="step">01</span>
              <h2>参考素材</h2>
              <div class="rule-tip">?
                <div id="rulePopover" class="rule-popover">正在读取当前上游的素材合同…</div>
              </div>
            </div>
            <div class="heading-tools"><p>拖动图片卡片可重新排序，提示词中可使用 Picture / Video / Audio 编号</p><label id="hailuoModeField" class="hailuo-mode-field hidden">H3 调用模式<select id="hailuoApiMode"><option value="auto">自动识别（推荐）</option><option value="text_to_video">文生视频</option><option value="image_to_video">图生视频</option><option value="video_to_video">视频生视频</option><option value="audio_to_video">音频生视频</option><option value="multimodal_to_video">全能多参</option></select></label></div>
          </div>

          <div class="material-layout">
            <div class="images-zone">
              <div class="zone-title"><span>图片参考</span><b id="imageCount">0 / 9</b></div>
              <div id="imageSlots" class="image-slots"></div>
            </div>
            <div class="av-zone">
              <div class="zone-title"><span>视频参考</span><b id="videoCount">0 / 3</b></div>
              <div id="videoSlots" class="video-slots"></div>
              <div class="zone-title audio-title"><span>音频参考</span><b id="audioCount">0 / 3</b></div>
              <div id="audioSlots" class="audio-slots"></div>
            </div>
          </div>

          <div class="duration-meter">
            <div><img src="../assets/icons/audio.png" alt=""><span>独立音频总时长</span><b id="audioDuration">0.0 秒</b></div>
            <div class="meter-track"><i id="audioMeter"></i><span></span><span></span><span></span></div>
          </div>
        </section>

        <section class="panel prompt-panel">
          <div class="panel-heading compact">
            <div><span class="step">02</span><h2>创作指令</h2></div>
            <button id="clearPrompt" class="text-button"><img src="../assets/icons/trash.png" alt="">清空</button>
          </div>
          <label class="prompt-wrap">
            <textarea id="prompt" maxlength="2000" placeholder="请描述你想生成的画面和动作。可使用“图1、视频1、音频1”等素材编号来指定人物、场景、动作或声音……"></textarea>
            <span><b id="promptCount">0</b> / 2000</span>
          </label>

          <div class="parameter-row">
            <div class="parameter-block ratio-block">
              <label>视频比例</label>
              <div id="ratioOptions" class="ratio-options"></div>
            </div>
            <div class="parameter-block duration-block">
              <label>生成时长</label>
              <div class="duration-control"><button id="durationMinus">−</button><strong><span id="durationValue">10</span> 秒</strong><button id="durationPlus">＋</button></div>
              <small>5–10 秒</small>
            </div>
            <div class="parameter-block output-block">
              <label>保存至</label>
              <button id="chooseOutput" class="output-picker"><img src="../assets/icons/folder.png" alt=""><span id="outputDir">正在读取默认目录…</span><b>更改</b></button>
            </div>
          </div>
        </section>

        <button id="submit" class="generate-button" disabled>
          <span class="light-runner"></span>
          <img src="../assets/icons/slot.png" alt="">
          <strong>开始生成</strong>
          <em id="submitProviderName">视频上游</em>
        </button>
      </section>

      <aside class="preview-column">
        <section class="panel preview-panel">
          <div class="panel-heading compact">
            <div><span class="step">03</span><h2>实时预览</h2></div>
            <span id="previewBadge" class="preview-badge">等待创作</span>
          </div>
          <div id="previewStage" class="preview-stage">
            <div id="previewEmpty" class="preview-empty">
              <div class="slot-orbit"><img src="../assets/icons/slot.png" alt=""><i></i><i></i><i></i></div>
              <h3>把灵感推入老虎机</h3>
              <p>素材锁定后，短剧将从这里开场</p>
            </div>
            <div id="progressState" class="progress-state hidden">
              <div class="progress-ring"><span id="progressPercent">0%</span></div>
              <h3 id="taskStatus">正在提交</h3>
              <p id="taskMessage">正在连接视频创作队列…</p>
            </div>
            <video id="resultVideo" class="result-video hidden" controls></video>
          </div>
          <button id="revealResult" class="reveal-button hidden"><img src="../assets/icons/folder.png" alt="">在文件夹中显示成品</button>
        </section>

        <section class="panel queue-panel">
          <div class="panel-heading compact"><div><h2>任务队列</h2><span id="queueCount" class="queue-count">0</span></div></div>
          <div id="queueEmpty" class="queue-empty">暂时没有生成任务</div>
          <article id="taskCard" class="task-card hidden">
            <div class="task-thumb"><img src="../assets/icons/sparkle.png" alt=""></div>
            <div><b id="queueTitle">短剧生成任务</b><span id="queueMeta">9:16 · 10 秒</span><em id="queueStatus">等待提交</em></div>
            <img class="task-lock" src="../assets/icons/lock.png" alt="">
          </article>
        </section>

        <pre id="diagnosticOutput" class="diagnostic hidden"></pre>
      </aside>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
